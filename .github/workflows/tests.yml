name: tests

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          # phpunit.xml force sqlite en mémoire ; phpspreadsheet utilise gd et zip.
          extensions: pdo_sqlite, sqlite3, mbstring, gd, zip
          tools: composer:v2
          coverage: none

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      # Les tests PHP n'en dépendent plus (`withoutVite()` dans Tests\TestCase),
      # mais cette étape vérifie que le build front — celui que Coolify exécute —
      # passe toujours, et génère les fichiers Wayfinder.
      - name: Build Assets
        run: pnpm build

      - name: Tests
        run: ./vendor/bin/pest

  # La production tourne sur MySQL 8.4 (ADR-001) alors que la matrice ci-dessus
  # teste sur SQLite : la classe de bug IFO-006 (migration valide sur SQLite,
  # cassée sur MySQL) restait invisible. Ce job rejoue la suite sur MySQL.
  # Les <env> de phpunit.xml ne surchargent pas les vraies variables
  # d'environnement : celles du step Tests prennent la main.
  ci-mysql:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ifosup_display_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, gd, zip
          tools: composer:v2
          coverage: none

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Tests (MySQL 8.4)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ifosup_display_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: ./vendor/bin/pest

  # Aucun workflow ne construisait l'image : une régression du Dockerfile ou de
  # l'entrypoint n'apparaissait qu'au déploiement Coolify. Le build suffit —
  # il exécute composer, pnpm build et Wayfinder dans le stage builder.
  docker-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t ifosup-display:ci .
