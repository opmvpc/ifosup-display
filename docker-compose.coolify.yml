# Déploiement Coolify — application et base de données, volumes persistants déclarés
# dans le dépôt.
#
# À utiliser en sélectionnant le build pack « Docker Compose » dans Coolify, avec ce
# fichier comme compose de l'application. Les volumes nommés ci-dessous survivent aux
# redéploiements : Coolify recrée les conteneurs, pas les volumes.
#
# Ne pas déclarer ces chemins avec l'instruction `VOLUME` du Dockerfile : elle produit
# un volume ANONYME, recréé vide à chaque conteneur. Les plannings importés seraient
# perdus à chaque déploiement, et les volumes orphelins s'accumuleraient.
#
# APP_KEY, DB_PASSWORD et DB_ROOT_PASSWORD sont écrits `${VAR}`, sans valeur par défaut :
# Coolify les présente ainsi comme des champs vides à remplir. Ne pas utiliser la forme
# `${VAR:?message}` — Coolify n'interprète pas `:?` comme une exigence et pré-remplit le
# champ avec le message lui-même, qui deviendrait le mot de passe.
#
# La base est incluse ici plutôt que déclarée comme ressource Coolify séparée : les
# sauvegardes intégrées de Coolify ne s'appliquent donc pas, elles sont prises en
# charge autrement (décision du 2026-08-20). Voir docs/deploiement-coolify.md.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Coolify remplace cette valeur par le domaine attribué à l'application.
      - SERVICE_FQDN_APP_80
      - APP_NAME=${APP_NAME:-Ifosup Display}
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-false}
      # Coolify renseigne SERVICE_FQDN_APP_80 avec le domaine attribué. Définir
      # APP_URL manuellement prend le dessus, utile derrière un proxy tiers.
      - APP_URL=${APP_URL:-${SERVICE_FQDN_APP_80:-}}
      - APP_LOCALE=${APP_LOCALE:-fr}
      - APP_FALLBACK_LOCALE=${APP_FALLBACK_LOCALE:-fr}
      - APP_SCREEN_TIMEZONE=${APP_SCREEN_TIMEZONE:-Europe/Brussels}
      - LOG_CHANNEL=${LOG_CHANNEL:-stack}
      - LOG_STACK=${LOG_STACK:-single}
      - LOG_LEVEL=${LOG_LEVEL:-warning}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-ifosup_display}
      - DB_USERNAME=${DB_USERNAME:-ifosup}
      - DB_PASSWORD=${DB_PASSWORD}
      - SESSION_DRIVER=${SESSION_DRIVER:-database}
      - SESSION_LIFETIME=${SESSION_LIFETIME:-120}
      - CACHE_STORE=${CACHE_STORE:-database}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-database}
      - BROADCAST_CONNECTION=${BROADCAST_CONNECTION:-log}
      - FILESYSTEM_DISK=${FILESYSTEM_DISK:-local}
      - MAIL_MAILER=${MAIL_MAILER:-log}
      # Compte administrateur créé au tout premier démarrage, uniquement si la table
      # `users` est vide. Indispensables au premier déploiement : sans eux, aucun compte
      # n'existe et personne ne peut se connecter. Sans effet ensuite.
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      # Plannings importés (storage/app/private) et médias des slides
      # (storage/app/public, exposé par le lien symbolique public/storage).
      - ifosup-storage:/app/storage/app
      - ifosup-logs:/app/storage/logs
    expose:
      - '80'
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-ifosup_display}
      - MYSQL_USER=${DB_USERNAME:-ifosup}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    volumes:
      - ifosup-mysql:/var/lib/mysql
    healthcheck:
      # L'application attend cet état avant de migrer : sans lui, le premier
      # déploiement démarrerait avant que la base accepte les connexions.
      #
      # Sans identifiants, délibérément : `mysqladmin ping` renvoie 0 dès que le serveur
      # répond, y compris sur un « Access denied » (vérifié). Le mot de passe qui figurait
      # ici n'apportait donc rien à la sonde, mais il apparaissait en clair dans
      # `docker inspect` et ajoutait une interpolation `${...}` de plus à faire traverser
      # au parseur de Coolify. Un serveur éteint fait bien échouer la sonde (exit 1).
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  ifosup-storage:
  ifosup-logs:
  ifosup-mysql:
