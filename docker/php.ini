; Réglages PHP propres au projet, chargés après php.ini-production.
;
; Sans php.ini actif, PHP retombe sur ses valeurs compilées (upload_max_filesize=2M,
; post_max_size=8M, memory_limit=128M) : tout téléversement au-delà de 2 Mo était
; rejeté avant même d'atteindre Laravel, avec le message trompeur « Le fichier est
; requis. ». Les limites ci-dessous couvrent la validation applicative réelle :
; vidéos de slides jusqu'à 300 Mo (ScreenSlideController, max:307200) et fichiers
; Excel jusqu'à 20 Mo (SchedulerImportController, max:20480).
upload_max_filesize = 300M
post_max_size = 310M
memory_limit = 512M
